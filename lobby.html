<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katana - Lobby</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-lobby">
    <header class="topbar">
        <div class="brand">KATANA</div>
        <div class="topbar-right">
            <span class="conn conn-connecting" id="connStatus" title="État de la connexion temps réel">
                <i></i><span id="connLabel">Connexion…</span>
            </span>
            <span class="me" id="meName"></span>
            <button type="button" class="btn btn-ghost btn-small" id="logoutBtn">Se déconnecter</button>
        </div>
    </header>

    <main class="lobby">
        <section class="table-card" aria-label="Table de jeu">
            <div class="table" id="table">
                <div class="table-center">
                    <div class="phase" id="phase">Salle d'attente</div>
                    <div class="count"><span id="count">0</span><small> / <span id="maxCount">7</span> joueurs</small></div>
                    <div class="progress" aria-hidden="true">
                        <div class="progress-bar" id="progressBar"></div>
                        <div class="progress-min" id="progressMin"></div>
                    </div>
                    <p class="hint" id="hint"></p>
                    <div class="actions">
                        <button type="button" class="btn btn-primary" id="joinBtn">Rejoindre</button>
                        <button type="button" class="btn btn-danger" id="startBtn" hidden>Lancer la partie</button>
                    </div>
                </div>
            </div>
        </section>

        <aside class="side">
            <section class="panel">
                <h2>Joueurs <span class="badge" id="playersCount">0</span></h2>
                <ul class="list" id="playersList"></ul>
            </section>
            <section class="panel">
                <h2>En ligne <span class="badge" id="onlineCount">0</span></h2>
                <ul class="list" id="onlineList"></ul>
            </section>
        </aside>
    </main>

    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/lobby.js"></script>
</body>
</html>
